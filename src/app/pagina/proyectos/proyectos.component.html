<section id="proyectos">
    <h1>PROYECTOS</h1>
    <article>
        <article *ngFor="let item of this.ProyectosTer">
            <img src="./assets/fotos/diseno-de-construccion.png" alt="">
            <h5><a [href]="'/'+item">{{item}}</a></h5>
        </article>
        <article *ngFor="let item of this.ProyectosFut">
            <img src="./assets/fotos/diseno-de-construccion.png" alt="">
            <h5><a href="#">Futuro proyecto {{item}}</a></h5>
        </article>
    </article>
</section>
